name: linux

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  linux_gcc_cxx17_omp_ompi:
    name: GNU@7.5 C++17 OMP OMPI
    runs-on: ubuntu-latest
    env: {OMP_NUM_THREADS: 2}
    steps:
    - uses: actions/checkout@v4
    - name: Dependencies
      run: .github/workflows/setup/ubuntu_ompi.sh
    - name: CCache Cache
      uses: actions/cache@v4
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: ~/.cache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: Build & Install
      run: |

        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=300M
        ccache -z

        pip install -U -e ./tools
        export CXXFLAGS="-fsanitize=undefined,address -fno-sanitize-recover=all"
        cmake -S . -B build                        \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo      \
            -DHiPACE_COMPUTE=OMP                   \
            -DCMAKE_CXX_STANDARD=17                \
            -DCMAKE_INSTALL_PREFIX=/tmp/my-hipace  \
            -DCMAKE_VERBOSE_MAKEFILE=ON
        cmake --build build -j 2

        ccache -s
        du -hs ~/.cache


    - name: Run Tests
      run: |
        #MPI implementations often leak memory
        export "ASAN_OPTIONS=detect_leaks=0"

        # Print stacktrace for easier debugging
        export UBSAN_OPTIONS=print_stacktrace=1

        ctest --test-dir build --output-on-failure

  linux_gcc_cxx17:
    name: GNU@7.5 C++17 Serial
    runs-on: ubuntu-latest
    env: {OMP_NUM_THREADS: 2}
    steps:
    - uses: actions/checkout@v4
    - name: Dependencies
      run: .github/workflows/setup/ubuntu.sh
    - name: CCache Cache
      uses: actions/cache@v4
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: |
          ~/.ccache
          ~/.cache/ccache
        key: ccache-linux-gccnompi-${{ hashFiles('.github/workflows/linux.yml') }}-${{ hashFiles('cmake/dependencies/AMReX.cmake') }}-${{ github.event.repository.pushed_at }}
        restore-keys: |
          ccache-linux-gccnompi-${{ hashFiles('.github/workflows/linux.yml') }}-
          ccache-linux-gccnompi-
    - name: Build & Install
      run: |
        pip install -U -e ./tools
        cmake -S . -B build             \
            -DHiPACE_MPI=OFF            \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DHiPACE_PUSHER=AB5
        cmake --build build -j 2
    - name: Run Tests
      run: ctest --test-dir build --output-on-failure
